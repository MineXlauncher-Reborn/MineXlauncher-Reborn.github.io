
<!doctype html>
<html lang="en" style="display: none">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MineXLauncher</title>
		<link
			rel="icon"
			type="image/webp"
			href="/resources/images/icons/favicon.webp"
		/>
		<link rel="stylesheet" href="/resources/styles/themes/default.css" />
		<link
			rel="stylesheet"
			id="theme"
			href="/resources/styles/themes/default.css"
			onload="document.documentElement.style.display = ''"
		/>
		<script src="/resources/scripts/google-tag.js"></script>
		<script src="/resources/scripts/main.js"></script>
	</head>
	<body>
		<div class="ads-container">
			<ins
				class="adsbygoogle"
				style="display: block"
				data-ad-client="ca-pub-1132419379737567"
				data-ad-slot="3280170072"
				data-ad-format="auto"
				data-full-width-responsive="true"
			></ins>
		</div>
		<div class="launcher">
			<span class="title-bar">MineXLauncher</span>
			<div class="content">
				<div class="sidebar">
					<span class="username"></span>
					<nav class="nav-bar">
						<ul>
							<li onclick="navigate.updates()">
								<img src="/resources/images/icons/nav/updates.webp" alt="Updates" />
								<span>Updates</span>
							</li>
							<li class="selected" onclick="navigate.home.game()">
								<img src="/resources/images/icons/nav/game.webp" alt="Game" />
								<span>Game</span>
							</li>
							<li onclick="navigate.servers()">
								<img src="/resources/images/icons/nav/servers.webp" alt="Servers" />
								<span>Server List</span>
							</li>
							<li onclick="navigate.addons.mods()">
								<img src="/resources/images/icons/nav/mods.webp" alt="Mods" />
								<span>Mods</span>
							</li>
							<li onclick="navigate.articles()">
								<img src="/resources/images/icons/nav/articles.webp" alt="Articles" />
								<span>Tutorials</span>
							</li>
							<li onclick="navigate.settings.general()">
								<img src="/resources/images/icons/nav/settings.webp" alt="Settings" />
								<span>Settings</span>
							</li>
						</ul>
					</nav>
				</div>
				<div class="main-panel">
					<div class="top-nav">
						<ul>
							<li onclick="navigate.home.game()">Game</li>
							<li onclick="navigate.home.clients()">Clients</li>
							<li onclick="navigate.home.archive()">Archive</li>
							<li class="selected" onclick="navigate.home.downloads()">
								Offline Downloads
							</li>
						</ul>
					</div>
					<div class="main-content">
	<div class="archive">
		<div>
			<label for="version-select">Select Version:</label>
			<select id="version-select" onchange="selectVersion(this.value)">
				<option disabled selected hidden value="">Select version</option>
				<optgroup label="Releases">
					<option value="1.12.2">1.12.2</option>
					<option value="1.12.2-wasm">1.12.2 WASM</option>
					<option value="1.8.8">1.8.8</option>
					<option value="1.8.8-wasm">1.8.8 WASM</option>
					<option value="1.7.10">1.7.10</option>
					<option value="1.6.4">1.6.4</option>
					<option value="1.5.2">1.5.2</option>
					<option value="1.4.7">1.4.7</option>
					<option value="1.4.7-wasm">1.4.7 WASM</option>
					<option value="1.2.5">1.2.5</option>
					<option value="1.2.5-wasm">1.2.5 WASM</option>
				</optgroup>
				<optgroup label="Beta">
					<option value="b1.8.1">Beta 1.8.1</option>
					<option value="b1.8.1-wasm">Beta 1.8.1 WASM</option>
					<option value="b1.7.3">Beta 1.7.3</option>
					<option value="b1.6.4">Beta 1.6.4</option>
					<option value="b1.5">Beta 1.5</option>
					<option value="b1.4">Beta 1.4</option>
					<option value="b1.3">Beta 1.3</option>
					<option value="b1.2">Beta 1.2</option>
					<option value="b1.1">Beta 1.1</option>
					<option value="b1.0">Beta 1.0</option>
				</optgroup>
				<optgroup label="Alpha">
					<option value="a1.2.6">Alpha 1.2.6</option>
					<option value="a1.1.2">Alpha 1.1.2</option>
					<option value="a1.0.6">Alpha 1.0.6</option>
				</optgroup>
				<optgroup label="Infdev">
					<option value="infdev">Infdev</option>
					<option value="infdev-wasm">Infdev WASM</option>
				</optgroup>
				<optgroup label="Indev">
					<option value="indev">Indev</option>
				</optgroup>
				<optgroup label="Classic">
					<option value="c0.3.0">Classic 0.3.0</option>
					<option value="c0.3.0-wasm">Classic 0.3.0 WASM</option>
				</optgroup>
				<optgroup label="Pre-Classic">
					<option disabled>Nothing here yet</option>
				</optgroup>
			</select>
		</div>

		<div>
			<label for="client-select">Client:</label>
			<select id="client-select" onchange="selectClient(this.value)">
				<option disabled selected hidden value="">Select client</option>
				<option value="starlike">Starlike</option>
				<option value="eaglerforge">EaglerForge</option>
				<option value="resent">Resent</option>
				<option value="shadow">Shadow</option>
				<option value="astra">Astra</option>
				<option value="precision">Precision</option>
				<option value="gx">GX-Client</option>
				<option value="tuff">Tuff</option>
				<option value="pixel">Pixel 1.12.2</option>
				<option value="efi-1.12">EFI 1.12.2</option>
				<option value="efi-1.8">EFI 1.8.8</option>
				<option value="wurst">Wurst</option>
				<option value="justin">Justin V3</option>
				<option value="ayun">Ayuncraft</option>
			</select>
		</div>

		<div>
			<button onclick="downloadSelected()">Download</button>
		</div>

	</div>
</div>

			<ins

				style="display: block"
				data-ad-client="ca-pub-1132419379737567"
